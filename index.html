<link rel='preconnect' href='https://fonts.gstatic.com' crossorigin>

<style>
:root{--bg:#101412;--ink:#e8f0ea;--muted:#93a59a;--faint:#6d7f75;--line:#2a3832;--ocean:#0c1210;--panel:#141a17;--gold:#e7c56a;--gold-ink:#1c1406}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--ink)}body{font-family:'Instrument Sans','Avenir Next','Segoe UI',sans-serif;font-size:15px}button,input{font:inherit;color:inherit}button{cursor:pointer}:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.app{height:100dvh;display:grid;grid-template-columns:minmax(0,1fr) minmax(300px,380px);grid-template-rows:auto minmax(0,1fr)}
header{grid-column:1 / -1;display:flex;flex-wrap:wrap;align-items:center;gap:12px 22px;padding:14px 18px 12px;border-bottom:1px solid var(--line);background:var(--bg)}
h1{margin:0;font-family:'Instrument Serif',Georgia,serif;font-weight:400;font-style:italic;font-size:32px;letter-spacing:-.03em;line-height:.9}
.brand small{display:block;margin-top:5px;color:var(--muted);font-size:12px;letter-spacing:.08em;text-transform:uppercase}
.rule{width:28px;height:1px;background:var(--gold);margin-top:8px}
.switcher{display:flex;gap:6px;flex:1 1 320px;overflow-x:auto;scrollbar-width:none}.switcher::-webkit-scrollbar{display:none}
.switcher button{flex:0 0 auto;border:1px solid var(--line);background:transparent;color:#d5e0d8;border-radius:999px;padding:8px 12px;white-space:nowrap}
.switcher button[aria-pressed='true']{background:var(--gold);color:var(--gold-ink);border-color:var(--gold)}
.stage{position:relative;min-width:0;min-height:0;background:var(--ocean)}
svg{width:100%;height:100%;display:block;touch-action:none;user-select:none;background:var(--ocean);cursor:grab}svg:active{cursor:grabbing}
.sphere{fill:#121a17}.grat{fill:none;stroke:#1d2a26;pointer-events:none}
.country{cursor:pointer;stroke:#0c1210;stroke-linejoin:round;transition:fill 520ms ease}
.highlight{fill:none;stroke:#f2d48a;stroke-linejoin:round;pointer-events:none}
.legend{position:absolute;left:14px;bottom:14px;width:228px;padding:10px 12px 11px;background:rgba(16,20,18,.92);border:1px solid var(--line);border-radius:12px;pointer-events:none}
.legend-top,.ticks{display:flex;justify-content:space-between;gap:8px}.legend-top{font-size:12px;margin-bottom:8px}.legend-top span:last-child,.ticks{color:var(--faint);font-size:11px;font-variant-numeric:tabular-nums}
.bar{height:8px;border-radius:99px;background:linear-gradient(90deg,#243830,#3f6d56,#8fbf73,#f0d56a,#ff9a3c)}.ticks{margin-top:5px}
.nodata{display:flex;align-items:center;gap:6px;margin-top:8px;color:var(--faint);font-size:11px}.nodata i{width:10px;height:10px;border-radius:2px;background:#1a2420;box-shadow:inset 0 0 0 1px #31423b}
.zoom{position:absolute;top:12px;right:12px;display:flex;flex-direction:column;gap:6px}
.zoom button{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:rgba(16,20,18,.92);color:var(--ink);font-size:14px}
#zfit{font-size:11px;letter-spacing:.04em}.zoom button:hover{border-color:#4d6158}
.tip{position:absolute;z-index:3;min-width:148px;padding:8px 10px 9px;background:#1a221e;border:1px solid #3c4d45;border-radius:10px;pointer-events:none;opacity:0;transition:opacity 120ms ease;box-shadow:0 12px 28px rgba(0,0,0,.35)}.tip.show{opacity:1}
.tip b{display:block;font-family:'Instrument Serif',Georgia,serif;font-weight:400;font-size:17px}.tip em{font-style:normal;color:var(--gold);font-variant-numeric:tabular-nums}.tip small{color:var(--muted)}
.status{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);pointer-events:none}
aside{background:var(--panel);border-left:1px solid var(--line);overflow:auto;padding:18px 18px 28px;min-height:0}
.finder{display:block;color:var(--faint);font-size:12px;letter-spacing:.08em;text-transform:uppercase}
.finder input{width:100%;margin-top:6px;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:#0e1411;letter-spacing:0;text-transform:none;font-size:15px}
#hits{list-style:none;margin:8px 0 0;padding:4px;border:1px solid var(--line);border-radius:10px;background:#0e1411}
#hits button{width:100%;text-align:left;background:transparent;border:0;border-radius:8px;padding:8px 10px}#hits button:hover{background:#1c2823}#hits small{color:var(--muted);margin-left:8px}
.kicker{margin:20px 0 0;color:var(--gold);font-size:11px;letter-spacing:.16em;text-transform:uppercase}
h2{margin:6px 0 0;font-family:'Instrument Serif',Georgia,serif;font-weight:400;font-size:clamp(32px,4vw,42px);letter-spacing:-.03em;line-height:.95}
.region{margin:6px 0 0;color:var(--muted)}
.value{margin:16px 0 0;font-family:'Instrument Serif',Georgia,serif;font-size:clamp(48px,6vw,68px);line-height:.85;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.gloss{margin:6px 0 0;color:var(--muted)}.rank{margin:12px 0 0;line-height:1.45}
.ghost{margin-top:12px;background:transparent;color:var(--gold);border:1px solid #4a4330;border-radius:999px;padding:8px 14px}.ghost:hover{background:#241e12}.ghost:disabled{opacity:.4;cursor:default}
h3{margin:26px 0 8px;font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}
#measures{list-style:none;margin:0;padding:0}#measures li{padding:8px 0;border-top:1px solid #24302b}
#measures .row{display:flex;justify-content:space-between;gap:12px;font-size:14px}#measures .row b{font-weight:500}
.meter{margin-top:6px;height:3px;background:#24302b;border-radius:99px}.meter span{display:block;height:100%;width:0;background:#6f9a68;border-radius:inherit}
#measures li.on .row b,#measures li.on .row span{color:var(--gold)}#measures li.on .meter span{background:var(--gold)}
.note{margin:18px 0 0;color:var(--faint);font-size:12px;line-height:1.45}
@media (max-width:860px){.app{grid-template-columns:1fr;grid-template-rows:auto minmax(180px,1fr) minmax(168px,40dvh)}header{grid-column:auto;padding:12px 14px}h1{font-size:28px}aside{border-left:0;border-top:1px solid var(--line)}.legend{width:min(228px,calc(100% - 64px))}}
@media (prefers-reduced-motion:reduce){.country,.tip{transition:none}}
</style>
</head>

<div class='app'>

<div class='switcher' role='tablist' aria-label='Measure'>
<button type='button' role='tab' data-m='life' aria-pressed='true'>Life expectancy</button>
<button type='button' role='tab' data-m='gdp' aria-pressed='false'>GDP per person</button>
<button type='button' role='tab' data-m='net' aria-pressed='false'>Internet access</button>
<button type='button' role='tab' data-m='renew' aria-pressed='false'>Renewable power</button>
<button type='button' role='tab' data-m='age' aria-pressed='false'>Median age</button>
</div>
</header>
<div class='stage' id='stage'>
<svg id='map' role='img' aria-label='World map colored by the selected measure'></svg>
<div class='legend'><div class='legend-top'><span id='leg-title'>Life expectancy</span><span id='leg-unit'>years</span></div><div class='bar'></div><div class='ticks'><span id='leg-lo'></span><span id='leg-mid'></span><span id='leg-hi'></span></div><div class='nodata'><i></i> No sample</div></div>
<div class='zoom'><button type='button' id='zin' aria-label='Zoom in'>+</button><button type='button' id='zout' aria-label='Zoom out'>−</button><button type='button' id='zfit' aria-label='Fit the world'>Fit</button></div>
<div class='tip' id='tip'></div>
<div class='status' id='status'>Drawing the atlas…</div>
</div>
<aside>
<label class='finder'>Find a country<input id='q' type='search' placeholder='Japan, Kenya, Brazil' autocomplete='off'></label>
<ul id='hits' hidden></ul>
<p class='kicker' id='kicker'>Selected</p>
<h2 id='cname'>Choose a country</h2>
<p class='region' id='cregion'></p>
<p class='value' id='cvalue' hidden></p>
<p class='gloss' id='cgloss'></p>
<p class='rank' id='crank'></p>
<button type='button' class='ghost' id='center' disabled>Center on map</button>
<h3>All measures</h3>
<ul id='measures'></ul>
<p class='note'>Rounded 2024 sample, built into the page so the map does not depend on a live feed. For comparison, not a statistical release.</p>
</aside>
</div>

const byId=new Map(ROWS.map(r=>[r.id,r]));
const ramp=d3.interpolateRgbBasis(['#243830','#3f6d56','#8fbf73','#f0d56a','#ff9a3c']);
const motion=!window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const stage=document.getElementById('stage');
const svg=d3.select('#map');
const tip=document.getElementById('tip');
const statusEl=document.getElementById('status');
const g=svg.append('g');
const sphere=g.append('path').attr('class','sphere');
const grat=g.append('path').attr('class','grat');
const countriesG=g.append('g');
const highlight=g.append('path').attr('class','highlight');
let width=0,height=0,projection,path,scale,metric='life',selected=null,features=[];
const zoom=d3.zoom().scaleExtent([1,10]).on('zoom',event=>{
  g.attr('transform',event.transform);
  const k=event.transform.k;
  countriesG.selectAll('path').attr('stroke-width',0.55/k);
  highlight.attr('stroke-width',1.7/k);
  grat.attr('stroke-width',0.7/k);
});
svg.call(zoom);
function values(key){return ROWS.map(r=>r[key]).filter(v=>v!=null)}
function formatValue(key,v){
  if(v==null)return 'No sample';
  if(key==='gdp'){if(v>=10000)return '$'+Math.round(v/1000)+'k';if(v>=1000)return '$'+(v/1000).toFixed(1)+'k';return '$'+Math.round(v)}
  if(key==='life'){const n=(Math.round(v*10)/10).toFixed(1);return n.endsWith('.0')?n.slice(0,-2):n}
  return String(Math.round(v))+(key==='net'||key==='renew'?'%':'');
}
function gapSentence(key,delta,median){
  const med=formatValue(key,median);
  const tiny=key==='gdp'?50:0.05;
  if(Math.abs(delta)<tiny)return 'At the sample median of '+med+'.';
  const dir=delta>0?'above':'below';
  if(key==='gdp')return formatValue(key,Math.abs(delta))+' '+dir+' the sample median of '+med+'.';
  if(key==='net'||key==='renew')return Math.round(Math.abs(delta))+' points '+dir+' the sample median of '+med+'.';
  return formatValue(key,Math.abs(delta))+' years '+dir+' the sample median of '+med+'.';
}
function buildScale(){
  const vals=values(metric);
  const min=d3.min(vals),max=d3.max(vals);
  scale=METRICS[metric].log?d3.scaleSequentialLog([min,max],ramp):d3.scaleSequential([min,max],ramp);
  const mid=METRICS[metric].log?Math.exp((Math.log(min)+Math.log(max))/2):(min+max)/2;
  document.getElementById('leg-title').textContent=METRICS[metric].label;
  document.getElementById('leg-unit').textContent=METRICS[metric].unit;
  document.getElementById('leg-lo').textContent=formatValue(metric,min);
  document.getElementById('leg-mid').textContent=formatValue(metric,mid);
  document.getElementById('leg-hi').textContent=formatValue(metric,max);
}
function colorOf(id){const row=byId.get(id);if(!row||row[metric]==null)return '#1a2420';return scale(row[metric])}
function paint(){countriesG.selectAll('path').attr('fill',d=>colorOf(+d.id))}
function featureFor(id){return features.find(d=>+d.id===id)||null}
function syncHighlight(){
  const f=featureFor(selected);
  highlight.attr('d',f?path(f):null);
  highlight.attr('stroke-width',1.7/d3.zoomTransform(svg.node()).k);
}
function ordinal(n){const s=['th','st','nd','rd'];const v=n%100;return n+(s[(v-20)%10]||s[v]||s[0])}
function renderPanel(){
  const row=selected!=null?byId.get(selected):null;
  const value=document.getElementById('cvalue');
  const list=document.getElementById('measures');
  const center=document.getElementById('center');
  list.innerHTML='';
  if(!row){
    document.getElementById('kicker').textContent='World view';
    document.getElementById('cname').textContent='Choose a country';
    document.getElementById('cregion').textContent='Click the map, or search. Drag to pan. Scroll or pinch to zoom.';
    value.hidden=true;
    document.getElementById('cgloss').textContent='';
    document.getElementById('crank').textContent='';
    center.disabled=true;
    return;
  }
  document.getElementById('kicker').textContent='Selected';
  document.getElementById('cname').textContent=row.name;
  document.getElementById('cregion').textContent=row.region;
  const v=row[metric];
  if(v==null){
    value.hidden=true;
    document.getElementById('cgloss').textContent='Not in this sample.';
    document.getElementById('crank').textContent='';
  }else{
    value.hidden=false;
    value.textContent=formatValue(metric,v);
    document.getElementById('cgloss').textContent=METRICS[metric].gloss;
    const vals=values(metric);
    const place=vals.filter(x=>x>v).length+1;
    document.getElementById('crank').textContent=ordinal(place)+' of '+vals.length+' in the sample. '+gapSentence(metric,v-d3.median(vals),d3.median(vals));
  }
  center.disabled=!featureFor(selected);
  Object.keys(METRICS).forEach(key=>{
    const li=document.createElement('li');
    if(key===metric)li.className='on';
    const raw=row[key];
    const vals=values(key);
    const min=d3.min(vals),max=d3.max(vals);
    const pct=raw==null||max===min?0:Math.round((raw-min)/(max-min)*100);
    const rowEl=document.createElement('div');
    rowEl.className='row';
    const b=document.createElement('b');
    b.textContent=METRICS[key].label;
    const span=document.createElement('span');
    span.textContent=formatValue(key,raw);
    rowEl.append(b,span);
    const meter=document.createElement('div');
    meter.className='meter';
    const fill=document.createElement('span');
    fill.style.width=pct+'%';
    meter.append(fill);
    li.append(rowEl,meter);
    list.append(li);
  });
}
function selectId(id,opts){
  selected=id;
  syncHighlight();
  renderPanel();
  if(opts&&opts.center){const f=featureFor(id);if(f)centerOn(f)}
}
function clearSelection(){selected=null;syncHighlight();renderPanel()}
function centerOn(feature){
  const b=path.bounds(feature);
  const dx=b[1][0]-b[0][0],dy=b[1][1]-b[0][1];
  const x=(b[0][0]+b[1][0])/2,y=(b[0][1]+b[1][1])/2;
  const k=Math.max(1.15,Math.min(8,0.62/Math.max(dx/width,dy/height)));
  const t=d3.zoomIdentity.translate(width/2,height/2).scale(k).translate(-x,-y);
  svg.transition().duration(motion?700:0).ease(d3.easeCubicOut).call(zoom.transform,t);
}
function fit(){
  width=stage.clientWidth;height=stage.clientHeight;
  if(width<20||height<20)return;
  svg.attr('viewBox','0 0 '+width+' '+height);
  projection=d3.geoEqualEarth().fitExtent([[18,16],[width-18,height-16]],{type:'Sphere'});
  path=d3.geoPath(projection);
  sphere.attr('d',path({type:'Sphere'}));
  grat.attr('d',path(d3.geoGraticule().step([30,30])()));
  countriesG.selectAll('path').attr('d',path);
  svg.call(zoom.transform,d3.zoomIdentity);
  syncHighlight();
}
function showTip(event,id){
  const row=byId.get(id);
  tip.replaceChildren();
  const b=document.createElement('b');
  b.textContent=row?row.name:'Unlisted territory';
  const em=document.createElement('em');
  em.textContent=row?formatValue(metric,row[metric]):'No sample';
  const small=document.createElement('small');
  small.textContent=METRICS[metric].label;
  tip.append(b,em,document.createElement('br'),small);
  tip.classList.add('show');
  const box=stage.getBoundingClientRect();
  let x=event.clientX-box.left+14,y=event.clientY-box.top+14;
  const tw=tip.offsetWidth,th=tip.offsetHeight;
  if(x+tw>box.width-8)x=event.clientX-box.left-tw-14;
  if(y+th>box.height-8)y=event.clientY-box.top-th-14;
  tip.style.left=Math.max(8,x)+'px';
  tip.style.top=Math.max(8,y)+'px';
}
function setMetric(next){
  metric=next;
  document.querySelectorAll('.switcher button').forEach(btn=>btn.setAttribute('aria-pressed',btn.dataset.m===next?'true':'false'));
  buildScale();paint();renderPanel();
}
document.querySelectorAll('.switcher button').forEach(btn=>btn.addEventListener('click',()=>setMetric(btn.dataset.m)));
document.getElementById('zin').addEventListener('click',()=>svg.transition().duration(motion?220:0).call(zoom.scaleBy,1.45));
document.getElementById('zout').addEventListener('click',()=>svg.transition().duration(motion?220:0).call(zoom.scaleBy,1/1.45));
document.getElementById('zfit').addEventListener('click',()=>svg.transition().duration(motion?600:0).ease(d3.easeCubicOut).call(zoom.transform,d3.zoomIdentity));
document.getElementById('center').addEventListener('click',()=>{const f=featureFor(selected);if(f)centerOn(f)});
const q=document.getElementById('q');
const hits=document.getElementById('hits');
q.addEventListener('input',()=>{
  const query=q.value.trim().toLowerCase();
  hits.replaceChildren();
  if(!query){hits.hidden=true;return}
  ROWS.filter(r=>r.name.toLowerCase().includes(query)&&r.id!==10).slice(0,6).forEach(r=>{
    const li=document.createElement('li');
    const button=document.createElement('button');
    button.type='button';
    button.textContent=r.name;
    const small=document.createElement('small');
    small.textContent=r.region;
    button.append(small);
    button.addEventListener('click',()=>{selectId(r.id,{center:true});hits.hidden=true;q.value=''});
    li.append(button);hits.append(li);
  });
  hits.hidden=!hits.children.length;
});
window.addEventListener('keydown',event=>{if(event.key==='Escape')clearSelection()});
sphere.on('click',clearSelection);
sphere.on('pointermove',()=>tip.classList.remove('show'));
let lastW=0;
new ResizeObserver(()=>{const w=stage.clientWidth;if(Math.abs(w-lastW)<2)return;lastW=w;if(features.length)fit()}).observe(stage);
async function main(){
  document.getElementById('sampleline').textContent=ROWS.filter(r=>r.life!=null).length+' countries · sample 2024';
  try{
    const world=await fetch('https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/countries-110m.json').then(r=>{if(!r.ok)throw new Error(String(r.status));return r.json()});
    features=topojson.feature(world,world.objects.countries).features;
    countriesG.selectAll('path').data(features).join('path').attr('class','country').attr('tabindex',0)
      .on('pointerenter',(event,d)=>showTip(event,+d.id))
      .on('pointermove',(event,d)=>showTip(event,+d.id))
      .on('pointerleave',()=>tip.classList.remove('show'))
      .on('click',(event,d)=>{event.stopPropagation();selectId(+d.id)})
      .on('keydown',(event,d)=>{if(event.key==='Enter'||event.key===' '){event.preventDefault();selectId(+d.id,{center:true})}});
    buildScale();fit();paint();statusEl.remove();selectId(710);
  }catch(err){
    statusEl.textContent='The atlas could not be loaded. Check the connection and reload.';
  }
}
main();
</script>
